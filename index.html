<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="phone-frame">
        <div class="phone-screen">

            <!-- Lock Screen Parent View -->
            <div id="lockScreen" class="screen-view active">
                
                <!-- Layer 1: Main Lock Screen Wallpaper & iOS Layout -->
                <div id="lockWallpaperLayer" class="lock-layer active">
                    <div class="lock-content-wrapper">
                        <div class="date-widget" id="date">Mon, 2 Nov</div>
                        <h1 class="time-display ios-lock-time" id="clock">12:00</h1>
                    </div>
                    
                    <!-- Bottom Flashlight & Camera Shortcuts -->
                    <div class="lock-shortcuts">
                        <button class="shortcut-btn" aria-label="Flashlight">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M6 2h12v2H6V2zm1 3h10v2H7V5zm1.5 3h7l1 13H7.5l1-13zm3.5 3v5h1v-5h-1z"/></svg>
                        </button>
                        <button class="shortcut-btn" aria-label="Camera" onclick="openApp('cameraApp')">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M4 6h3l1.5-2h7L17 6h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm8 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-2a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Layer 2: Passcode Keypad View -->
                <div id="passcodeLayer" class="lock-layer">
                    <div class="lock-header compact">
                        <p class="passcode-label">Enter Passcode</p>
                    </div>

                    <div class="lock-bottom">
                        <p class="error-msg" id="errorMsg"></p>
                        <div class="passcode-dots">
                            <div class="dot" id="dot1"></div>
                            <div class="dot" id="dot2"></div>
                            <div class="dot" id="dot3"></div>
                            <div class="dot" id="dot4"></div>
                        </div>

                        <!-- Keypad -->
                        <div class="keypad">
                            <button class="key" onclick="pressKey('1')"><span class="num">1</span></button>
                            <button class="key" onclick="pressKey('2')"><span class="num">2</span><span class="sub">A B C</span></button>
                            <button class="key" onclick="pressKey('3')"><span class="num">3</span><span class="sub">D E F</span></button>

                            <button class="key" onclick="pressKey('4')"><span class="num">4</span><span class="sub">G H I</span></button>
                            <button class="key" onclick="pressKey('5')"><span class="num">5</span><span class="sub">J K L</span></button>
                            <button class="key" onclick="pressKey('6')"><span class="num">6</span><span class="sub">M N O</span></button>

                            <button class="key" onclick="pressKey('7')"><span class="num">7</span><span class="sub">P Q R S</span></button>
                            <button class="key" onclick="pressKey('8')"><span class="num">8</span><span class="sub">T U V</span></button>
                            <button class="key" onclick="pressKey('9')"><span class="num">9</span><span class="sub">W X Y Z</span></button>

                            <button class="key center-zero" onclick="pressKey('0')"><span class="num">0</span></button>
                        </div>

                        <!-- Bottom Action Row -->
                        <div class="passcode-footer">
                            <button class="footer-btn" onclick="alert('Emergency Call')">Emergency</button>
                            <button class="footer-btn" onclick="cancelPasscode()">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Home Screen View -->
            <div id="homeScreen" class="screen-view">
                <div class="top-bar">
                    <button class="lock-btn" onclick="lockPhone()">Lock</button>
                </div>

                <div class="home-layout-container">
                    
                    <!-- Row 1: Top Left Apps (4 Apps) + Top Right Small Widget -->
                    <div class="home-row">
                        <div class="app-quad-grid">
                            <div class="app-icon" onclick="openApp('photosApp')">
                                <img src="IMG_1594.jpeg" class="icon-img" alt="Photos">
                                <span>Photos</span>
                            </div>
                            <div class="app-icon" onclick="openApp('gmailApp')">
                                <img src="IMG_1595.jpeg" class="icon-img" alt="Gmail">
                                <span>Gmail</span>
                            </div>
                            <div class="app-icon" onclick="openApp('clockApp')">
                                <img src="IMG_1596.jpeg" class="icon-img" alt="Clock">
                                <span>Clock</span>
                            </div>
                            <div class="app-icon" onclick="openApp('calendarApp')">
                                <img src="IMG_1599.jpeg" class="icon-img" alt="Calendar">
                                <span>Calendar</span>
                            </div>
                        </div>

                        <!-- Top Right Small Widget -->
                        <div class="square-widget">
                            <img src="IMG_1612.jpeg" alt="Widget Picture">
                            <span class="widget-label">Widgetsmith</span>
                        </div>
                    </div>

                    <!-- Row 2: Middle Wide Medium Widget Banner -->
                    <div class="banner-widget">
                        <img src="IMG_1615.jpeg" alt="Banner Widget">
                        <span class="widget-label">Widgetsmith</span>
                    </div>

                    <!-- Row 3: Bottom Left Small Widget + Bottom Right Apps (4 Apps) -->
                    <div class="home-row">
                        <!-- Bottom Left Small Widget -->
                        <div class="square-widget">
                            <img src="IMG_1614.jpeg" alt="Widget Picture">
                            <span class="widget-label">Widgetsmith</span>
                        </div>

                        <div class="app-quad-grid">
                            <div class="app-icon" onclick="openApp('notesApp')">
                                <img src="IMG_1598.jpeg" class="icon-img" alt="Notes">
                                <span>Notes</span>
                            </div>
                            <div class="app-icon" onclick="openApp('spotifyApp')">
                                <img src="IMG_1600.jpeg" class="icon-img" alt="Spotify">
                                <span>Spotify</span>
                            </div>
                            <div class="app-icon" onclick="openApp('robloxApp')">
                                <img src="IMG_1602.jpeg" class="icon-img" alt="Roblox">
                                <span>Roblox</span>
                            </div>
                            <div class="app-icon" onclick="openApp('instaApp')">
                                <img src="IMG_1601.jpeg" class="icon-img" alt="Instagram">
                                <span>Instagram</span>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Bottom Glass Dock (Phone, Camera, Messages) -->
                <div class="home-dock">
                    <div class="dock-icon" onclick="openApp('phoneApp')">
                        <img src="IMG_1603.jpeg" class="icon-img" alt="Phone">
                    </div>
                    <div class="dock-icon" onclick="openApp('cameraApp')">
                        <img src="IMG_1604.jpeg" class="icon-img" alt="Camera">
                    </div>
                    <div class="dock-icon" onclick="openApp('messagesApp')">
                        <img src="IMG_1597.jpeg" class="icon-img" alt="Messages">
